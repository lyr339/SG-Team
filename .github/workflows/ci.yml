name: CI

# PR 验证；版本标签由 Release 覆盖，不在同一发布提交上重复跑 main CI。

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:dead
      # build 自带 typecheck；主分支只验证，不生成重复安装包。
      - run: npm run build
      - run: npm run smoke:channel
