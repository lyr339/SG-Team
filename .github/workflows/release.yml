name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 检查版本标签
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: node node_modules/electron/install.js
      # dist:mac 内含 build / typecheck、签名与 zip 打包。
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-mac-arm64
          path: release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node node_modules/electron/install.js
      # pack:win 内含 build / typecheck。
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 检查双平台产物
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "artifacts/ShiGuang-${version}-mac-arm64.zip"
          test -s "artifacts/ShiGuang-Setup-${version}.exe"
          test -s "artifacts/ShiGuang-Setup-${version}.exe.blockmap"
          test -s artifacts/latest.yml
      - name: 生成更新清单
        run: |
          awk '/^## / { section++; if (section > 1) exit } section == 1 { print }' .github/release-notes.md > current-release-notes.md
          node scripts/update-manifest.mjs \
            --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" \
            --notes current-release-notes.md --assets artifacts --out artifacts/update-manifest.json \
            --repo "$GITHUB_REPOSITORY"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "拾光 $GITHUB_REF_NAME" \
              --notes-file current-release-notes.md
          fi
