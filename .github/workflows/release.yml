name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: 检查版本标签
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run lint:dead
      - run: node node_modules/electron/install.js
      - run: npm run dist:mac
      - run: npm run smoke:channel
      - run: npm run smoke:wire:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-mac-arm64
          path: release/*.zip
          if-no-files-found: error

  windows:
    name: Windows · 发布
    # 发布只消费本次已通过的 macOS 包，不轮询、不创建半成品 Release。
    needs: mac
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: 检查版本标签
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run lint:dead
      - run: node node_modules/electron/install.js
      - run: npm run pack:win
      - run: npm run smoke:channel
      - run: npm run smoke:wire:packaged
      - uses: actions/download-artifact@v4
        with:
          name: shiguang-mac-arm64
          path: artifacts
      - name: 检查双平台产物并生成更新清单
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp release/*.exe release/*.exe.blockmap release/latest.yml artifacts/
          test -s "artifacts/ShiGuang-${version}-mac-arm64.zip"
          test -s "artifacts/ShiGuang-Setup-${version}.exe"
          test -s "artifacts/ShiGuang-Setup-${version}.exe.blockmap"
          test -s artifacts/latest.yml
          awk '/^## / { section++; if (section > 1) exit } section == 1 { print }' .github/release-notes.md > current-release-notes.md
          node scripts/update-manifest.mjs \
            --version "$version" --tag "$GITHUB_REF_NAME" \
            --notes current-release-notes.md --assets artifacts --out artifacts/update-manifest.json \
            --repo "$GITHUB_REPOSITORY"
      - name: 发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "拾光 $GITHUB_REF_NAME" \
              --notes-file current-release-notes.md
          fi
