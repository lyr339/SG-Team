# 发版：推一个 v* tag（须等于 package.json 的 version，例如 v0.2.0）→ 打 mac zip 与 Windows 安装包
# → 挂到 GitHub Release。仓库公开，收件人凭链接下载，不需要 GitHub 账号。
# workflow_dispatch 手动触发时只产出 artifact，不建 Release（没有 tag 可挂）。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 不设 ELECTRON_MIRROR：npmmirror 从 GitHub 的 runner 拉 Electron 二进制极慢，默认源最快。
jobs:
  mac:
    # macos-latest 是 Apple Silicon runner；pack:mac 复用 npm ci 装下来的 arm64 Electron。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: tag 必须等于 package.json 的版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 版本 $expected 不一致；先改 version 再打 tag" >&2
            exit 1
          fi
      - run: npm run typecheck
      # npm ≥12 默认不跑依赖的 install 脚本（allowScripts 名单只是建议 / 版本匹配规则随 npm 变），
      # electron 的 postinstall 不一定下过二进制：显式补一次（幂等），否则 electronDist 不存在。
      - run: node node_modules/electron/install.js
      # pack:mac + adhoc 重签 + ditto 压缩（scripts/dist-mac.mjs：未签名的 Electron 包传到别的 Mac
      # 会被 Gatekeeper 判「已损坏」；重签后变成「无法验证开发者」，系统设置里有「仍要打开」）。
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-mac-arm64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # npm ≥12 默认不跑依赖的 install 脚本（allowScripts 名单只是建议 / 版本匹配规则随 npm 变），
      # electron 的 postinstall 不一定下过二进制：显式补一次（幂等），否则 electronDist 不存在。
      - run: node node_modules/electron/install.js
      # 失败时把日志尾部写成 annotation（Actions 日志要登录才能看，annotation 匿名可读）。
      - name: pack:win
        shell: pwsh
        run: |
          npm run pack:win 2>&1 | Tee-Object -FilePath pack-win.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pack-win.log -Tail 30 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Output "::error title=pack:win failed::$tail"
            exit 1
          }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pack-win-log
          path: pack-win.log
          retention-days: 7
      # latest.yml + .blockmap 是应用内更新（electron-updater）的更新源：客户端经 releases.atom 找到最新
      # tag，再从 releases/download/<tag>/latest.yml 读版本与 sha512；blockmap 让下载只取差分块。
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    # mac 产物是硬要求；Windows 安装包从未在真实机器上验证过，它打包失败不阻塞发 mac 版，
    # Release 里就只有 zip——日志会列出实际上传了什么。
    needs: [mac, windows]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # mac 自更新的更新源：静态清单登记本版每个产物的 sha512 / 大小与发布说明，随资产一起上传；
      # 客户端经 releases/latest/download/update-manifest.json 取（不计 REST 限额）。Windows 仍读 latest.yml。
      - name: 提取本版简要说明
        run: awk '/^## / { section++; if (section > 1) exit } section == 1 { print }' .github/release-notes.md > current-release-notes.md
      - name: 生成更新清单
        run: |
          node scripts/update-manifest.mjs \
            --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" \
            --notes current-release-notes.md --assets artifacts --out artifacts/update-manifest.json \
            --repo "$GITHUB_REPOSITORY"
      - name: 建 Release（已存在则只覆盖上传产物）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "拾光 $GITHUB_REF_NAME" \
              --notes-file current-release-notes.md
          fi
          echo "Windows 打包结果：${{ needs.windows.result }}"
